# =============================================
# 자동 매매봇 설정 파일
# 실제 API 키를 입력하세요
# =============================================

mode: "paper"  # "paper" (모의) | "live" (실거래) - 처음엔 반드시 paper!

# ── 한국투자증권 (KIS) ──────────────────────
kis:
  app_key: "YOUR_KIS_APP_KEY"
  app_secret: "YOUR_KIS_APP_SECRET"
  account_no: "YOUR_ACCOUNT_NUMBER"   # 예: 12345678-01
  is_paper: true  # 모의투자 여부

# ── 업비트 (Upbit) ──────────────────────────
upbit:
  access_key: "YOUR_UPBIT_ACCESS_KEY"
  secret_key: "YOUR_UPBIT_SECRET_KEY"

# ── 바이낸스 (Binance) ──────────────────────
binance:
  api_key: "YOUR_BINANCE_API_KEY"
  api_secret: "YOUR_BINANCE_API_SECRET"
  testnet: true  # 테스트넷 사용 여부

# ── 매매 설정 ────────────────────────────────
trading:
  # 국내 주식
  stocks:
    - symbol: "005930"   # 삼성전자
      strategy: "ma_crossover"
      amount: 500000     # 1회 매수 금액 (원)
    - symbol: "000660"   # SK하이닉스
      strategy: "rsi"
      amount: 300000

  # 코인 (업비트) — 변동성 돌파 + RSI 조합 권장
  upbit_coins:
    - symbol: "KRW-BTC"
      strategy: "volatility_breakout"
      amount: 100000     # 1회 매수 금액 (원)
    - symbol: "KRW-ETH"
      strategy: "rsi"
      amount: 100000

  # 코인 (바이낸스) — MACD 전략 적용
  binance_coins:
    - symbol: "BTCUSDT"
      strategy: "macd"
      amount: 50         # USDT 기준

# ── 리스크 관리 ──────────────────────────────
risk:
  max_loss_pct: 3.0      # 종목당 최대 손실 % (손절)
  take_profit_pct: 5.0   # 목표 수익 % (익절)
  max_positions: 5       # 최대 동시 보유 종목 수
  daily_loss_limit: 2.0  # 일일 최대 손실 % (이 넘으면 봇 중단)

# ── 전략별 파라미터 ──────────────────────────
strategies:
  ma_crossover:
    short_period: 5
    long_period: 20
    interval: "1d"       # 1m, 5m, 15m, 1h, 1d

  rsi:
    period: 14
    oversold: 30         # RSI < 30 → 매수
    overbought: 70       # RSI > 70 → 매도
    interval: "1h"

  bollinger:
    period: 20
    std_dev: 2.0
    interval: "1h"

  volatility_breakout:
    k: 0.5             # 변동성 배수 (낮을수록 신호 많음, 권장 0.3~0.7)
    use_ma_filter: true  # true: 하락장 진입 방지 (권장)
    ma_period: 20      # MA 필터 기간
    interval: "1d"     # 일봉 기준으로 운영

  macd:
    fast: 12           # 단기 EMA 기간
    slow: 26           # 장기 EMA 기간
    signal: 9          # 시그널선 기간
    use_zero_filter: false  # true: 제로선 반대방향 교차 신호 무시
    interval: "4h"     # 4시간봉 권장 (1h도 가능)

# ── 웹 서버 ─────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000
