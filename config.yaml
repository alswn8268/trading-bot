# =============================================
# 자동 매매봇 설정 파일
# 실제 API 키를 입력하세요
# =============================================

mode: "paper"  # "paper" (모의) | "live" (실거래) - 처음엔 반드시 paper!

# ── 한국투자증권 (KIS) ──────────────────────
kis:
  app_key: "YOUR_KIS_APP_KEY"
  app_secret: "YOUR_KIS_APP_SECRET"
  account_no: "YOUR_ACCOUNT_NUMBER"   # 예: 12345678-01
  is_paper: true  # 모의투자 여부

# ── 업비트 (Upbit) ──────────────────────────
upbit:
  access_key: "ceu8yux4xDpUpAlN5a1UGxgUN5LtmeZmpe9hbYLT"
  secret_key: "cPM9lx1oFoCuAD8CTUHYAhUzyDxgFPZgWUSJbLxU"

# ── 바이낸스 (Binance) ──────────────────────
binance:
  api_key: "YOUR_BINANCE_API_KEY"
  api_secret: "YOUR_BINANCE_API_SECRET"
  testnet: true  # 테스트넷 사용 여부

# ── 매매 설정 ────────────────────────────────
trading:
  # 코인 (업비트) — 단타 설정
  upbit_coins:
    - symbol: "KRW-BTC"
      strategy: "bollinger_short"       # 15분봉 볼린저 단타
      amount: 5000
    - symbol: "KRW-ETH"
      strategy: "bollinger_short"       # 15분봉 볼린저 단타
      amount: 5000
    - symbol: "KRW-XRP"
      strategy: "rsi_short"             # 15분봉 RSI 단타
      amount: 5000

# ── 리스크 관리 ──────────────────────────────
risk:
  max_loss_pct: 0.4      # 종목당 최대 손실 % (손절) — 1분봉 초단타
  take_profit_pct: 0.6   # 목표 수익 % (익절) — 수수료 0.1% 커버 후 순익
  max_positions: 3       # 최대 동시 보유 종목 수
  daily_loss_limit: 3.0  # 일일 최대 손실 % (이 넘으면 봇 중단)

# ── 전략별 파라미터 ──────────────────────────
strategies:
  ma_crossover:
    short_period: 5
    long_period: 20
    interval: "1d"       # 1m, 5m, 15m, 1h, 1d

  rsi:
    period: 14
    oversold: 30         # RSI < 30 → 매수
    overbought: 70       # RSI > 70 → 매도
    interval: "1h"

  bollinger:
    period: 20
    std_dev: 2.0
    interval: "1h"

  volatility_breakout:
    k: 0.5              # 변동성 비율 (0.3~0.7, 낮을수록 민감)
    ma_period: 5        # MA 필터 기간 (하락 추세 진입 방지)
    use_ma_filter: true # true 권장 (false로 하면 하락장에서 매수 위험)
    interval: "1d"      # 일봉 기준

  # ── 코인 단타용 (15분봉 기준) ─────────────────
  ma_crossover_short:
    short_period: 3     # 빠른 단기선
    long_period: 10     # 빠른 장기선
    interval: "15m"

  rsi_short:
    period: 5           # 짧은 period로 1분봉 빠른 반응
    oversold: 30
    overbought: 70
    interval: "1m"

  bollinger_short:
    period: 10          # 1분봉 기준 10개 캔들 (10분)
    std_dev: 2.0
    scalp_exit: true    # 밴드 30% 회복 시 즉시 청산
    interval: "1m"

  # ── AI 전략 (Claude API 기반 종합 분석) ─────
  ai:
    api_key: "YOUR_ANTHROPIC_API_KEY"  # console.anthropic.com 에서 발급
    model: "claude-haiku-4-5-20251001" # 빠르고 저렴 (claude-opus-4-6 도 가능)
    interval: "1h"                     # 분석 간격

# ── 웹 서버 ─────────────────────────────────
server:
  host: "0.0.0.0"
  port: 18880
